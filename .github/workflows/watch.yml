name: Koto written exam slot watch

on:
  schedule:
    - cron: '2/5 * * * *'
  workflow_dispatch:
    inputs:
      run_watch:
        description: 'Run the email watch once (requires ENABLE_WATCH=true)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: koto-written-exam-watch
  cancel-in-progress: false

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' && !inputs.run_watch
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Probe calendar without credentials
        run: python3 watch.py --probe

  watch:
    if: (github.event_name == 'schedule' || inputs.run_watch) && vars.ENABLE_WATCH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check slots and notify
        env:
          GH_TOKEN: ${{ github.token }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          START_DATE: ''
          END_DATE: ''
          TIME_OF_DAY: all
        run: python3 watch.py
